# Render Blueprint — connect the repository on render.com and it deploys the Dockerfile.
# The app reads $PORT (set by Render) and serves UI, REST and WebSocket from one origin.
services:
  - type: web
    name: fun-friday
    runtime: docker
    plan: free
    region: frankfurt # or oregon, ohio, singapore
    healthCheckPath: /actuator/health
    envVars:
      - key: JAVA_TOOL_OPTIONS
        value: -XX:MaxRAMPercentage=75 -XX:+ExitOnOutOfMemoryError
      # Only needed when the UI is served from another origin (comma-separated).
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: WS_ALLOWED_ORIGINS
        sync: false
    # The free plan has no persistent disk: game history starts empty after each deploy.
    # On a paid plan, add a disk mounted at /app/data to keep it.
