# Render Blueprint of the live service https://fun-friday-game.onrender.com (Docker, free plan).
# The app reads $PORT (set by Render) and serves UI, REST and WebSocket from one origin.
# Keep `name` and `region` equal to the existing service: Render applies a Blueprint to the service
# with the same name, and a service's region can't change after creation.
services:
  - type: web
    name: fun-friday-game
    runtime: docker
    plan: free
    region: oregon
    # A deploy goes live only once this path answers 2xx/3xx (Render gives up after 15 minutes).
    # CI starts the image and probes this path too (see .github/workflows/ci.yml, job `docker`).
    healthCheckPath: /actuator/health
    # Deploy a commit only after its GitHub checks (CI) have passed.
    autoDeployTrigger: checksPass
    envVars:
      - key: JAVA_TOOL_OPTIONS
        value: -XX:MaxRAMPercentage=75 -XX:+ExitOnOutOfMemoryError
      # Only needed when the UI is served from another origin (comma-separated).
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: WS_ALLOWED_ORIGINS
        sync: false
    # The free plan has no persistent disk: game history starts empty after each deploy.
    # On a paid plan, add a disk mounted at /app/data to keep it.
