# Render Blueprint - One-click deployment config
# Only needed if you connect your Git repo to Render
# Usage: Connect repo → Render auto-detects this file → Click Deploy

services:
  - type: web
    name: fun-friday-game
    runtime: docker
    plan: free
    region: oregon  # or singapore, frankfurt, ohio
    healthCheckPath: /api/game-types
    envVars:
      - key: PORT
        value: 8080
      - key: CORS_ALLOWED_ORIGINS
        sync: false  # Set manually in Render dashboard after deploy
      - key: WS_ALLOWED_ORIGINS
        sync: false  # Set manually in Render dashboard after deploy
      - key: JAVA_OPTS
        value: -Xmx256m -Xms128m
