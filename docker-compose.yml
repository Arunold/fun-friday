# Fun Friday — run everything with one command:  docker compose up --build
# Then open http://localhost:8080 (share http://<your-ip>:8080 with your team).
services:
  fun-friday:
    build: .
    image: fun-friday:latest
    ports:
      - '8080:8080'
    environment:
      # Same-origin by default; list extra origins only if the UI is served elsewhere.
      CORS_ALLOWED_ORIGINS: ''
      WS_ALLOWED_ORIGINS: ''
      JAVA_TOOL_OPTIONS: '-XX:MaxRAMPercentage=75 -XX:+ExitOnOutOfMemoryError'
    volumes:
      # Game history, leaderboard (H2 database).
      - fun-friday-data:/app/data
    restart: unless-stopped

volumes:
  fun-friday-data:
