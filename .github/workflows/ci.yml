# Continuous integration: backend (format, static checks, tests), frontend (lint, format, build),
# a game scaffolded from the template, end-to-end tests of the packaged app, and the Docker image
# (build, then a smoke test that starts it the way Render does).
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend · build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      # `build` = Spotless check + Checkstyle + scenario/integration tests + boot jar.
      - name: Build
        working-directory: backend
        run: ./gradlew build --console=plain
      - name: Contract is up to date
        run: git diff --exit-code -- docs/openapi.json
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: backend-test-reports
          path: |
            backend/**/build/reports/
            games/*/backend/build/reports/

  frontend:
    name: Frontend · lint & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run lint:frontend
      - run: npm run format:check
      - run: npm run build:frontend
      - name: Game registry is up to date
        run: git diff --exit-code -- frontend/src/app/games/registry.generated.ts

  template:
    name: Game template · scaffold & check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      # A game made with `npm run new-game` must pass every check without edits.
      - run: npm run new-game -- scaffold-check "Scaffold Check"
      - run: npx eslint games/scaffold-check && npx prettier --check games/scaffold-check
      - run: npm run build:frontend
        env:
          FF_GAMES: scaffold-check
      - name: Scenario tests, Spotless and Checkstyle
        working-directory: backend
        run: ./gradlew -PffGames=scaffold-check :games:scaffold-check:check --console=plain

  e2e:
    name: End-to-end (Playwright)
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build:frontend
      - name: Package the app
        working-directory: backend
        run: ./gradlew :app:bootJar --console=plain
      - run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            e2e/playwright-report/
            e2e/test-results/

  docker:
    name: Docker image
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: fun-friday:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # Start the image the way Render runs it (512 MB, its own $PORT) and wait for the health check
      # path from render.yaml: Render only switches to a new deploy once that path answers 2xx/3xx.
      - name: Smoke test
        run: |
          health=$(sed -n 's/^ *healthCheckPath: *\([^ #]*\).*/\1/p' render.yaml)
          test -n "$health" || { echo "::error::render.yaml has no healthCheckPath"; exit 1; }
          docker run -d --name app --memory 512m -e PORT=10000 -p 8080:10000 fun-friday:ci
          get() { curl -fsS --max-time 5 "http://localhost:8080$1"; }
          for _ in $(seq 90); do get "$health" > /dev/null 2>&1 && break; sleep 2; done
          get "$health" || { docker logs app; echo "::error::$health never became healthy"; exit 1; }
          [[ "$(get /)" == *'<ff-root>'* ]] || { echo "::error::/ does not serve the app"; exit 1; }
          [[ "$(get /api/games)" == *'"id":'* ]] || { echo "::error::/api/games lists no games"; exit 1; }
