# Continuous integration: backend (format, static checks, tests), frontend (lint, format, build),
# a game scaffolded from the template, end-to-end tests of the packaged app, and a Docker image build.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend · build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      # `build` = Spotless check + Checkstyle + scenario/integration tests + boot jar.
      - name: Build
        working-directory: backend
        run: ./gradlew build --console=plain
      - name: Contract is up to date
        run: git diff --exit-code -- docs/openapi.json
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: backend-test-reports
          path: |
            backend/**/build/reports/
            games/*/backend/build/reports/

  frontend:
    name: Frontend · lint & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run lint:frontend
      - run: npm run format:check
      - run: npm run build:frontend
      - name: Game registry is up to date
        run: git diff --exit-code -- frontend/src/app/games/registry.generated.ts

  template:
    name: Game template · scaffold & check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      # A game made with `npm run new-game` must pass every check without edits.
      - run: npm run new-game -- scaffold-check "Scaffold Check"
      - run: npx eslint games/scaffold-check && npx prettier --check games/scaffold-check
      - run: npm run build:frontend
        env:
          FF_GAMES: scaffold-check
      - name: Scenario tests, Spotless and Checkstyle
        working-directory: backend
        run: ./gradlew -PffGames=scaffold-check :games:scaffold-check:check --console=plain

  e2e:
    name: End-to-end (Playwright)
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build:frontend
      - name: Package the app
        working-directory: backend
        run: ./gradlew :app:bootJar --console=plain
      - run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            e2e/playwright-report/
            e2e/test-results/

  docker:
    name: Docker image
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: fun-friday:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
