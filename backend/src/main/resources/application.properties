# Server Configuration
server.port=${PORT:8080}

# CORS Configuration
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}
app.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
app.cors.allowed-headers=*
app.cors.allow-credentials=true

# WebSocket Configuration
app.websocket.endpoint=/ws
app.websocket.allowed-origins=${WS_ALLOWED_ORIGINS:http://localhost:4200}
app.websocket.message-size-limit=524288
app.websocket.send-buffer-size=1048576
app.websocket.send-time-limit=20000

# Static Resources (for serving Angular app)
spring.web.resources.static-locations=classpath:/static/
spring.mvc.static-path-pattern=/ui/**
