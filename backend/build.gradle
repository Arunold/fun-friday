plugins {
	id 'java'
	id 'org.springframework.boot' version '3.2.5'
	id 'io.spring.dependency-management' version '1.1.4'
	id 'checkstyle'
	id 'com.diffplug.spotless' version '6.25.0'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

sourceCompatibility = '21'
targetCompatibility = '21'
group = 'com.example'
version = '0.0.1-SNAPSHOT'

repositories {
	mavenCentral()
}

// Checkstyle configuration
checkstyle {
	toolVersion = '10.12.5'
	configFile = file("${rootDir}/config/checkstyle/checkstyle.xml")
	ignoreFailures = false
	maxWarnings = 0
}

tasks.withType(Checkstyle) {
	reports {
		xml.required = false
		html.required = true
	}
}

// Spotless code formatter configuration (aligned with Checkstyle)
spotless {
	java {
		target 'src/**/*.java'
		
		// Remove unused imports
		removeUnusedImports()
		
		// Import ordering (matches Checkstyle config)
		importOrder('java', 'javax', 'jakarta', 'org', 'com', '')
		
		// Google Java Format for consistent style
		googleJavaFormat('1.19.2').aosp()
		
		// Trim trailing whitespace (matches Checkstyle RegexpSingleline)
		trimTrailingWhitespace()
		
		// Ensure file ends with newline
		endWithNewline()
		
		// Format annotations on their own line
		formatAnnotations()
	}
}

// Run spotlessCheck before checkstyle
tasks.named('checkstyleMain') {
	dependsOn 'spotlessCheck'
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-websocket'
	
	// Apache Commons Text for string similarity (Levenshtein distance)
	implementation 'org.apache.commons:commons-text:1.11.0'
	
	// Lombok for reducing boilerplate
	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'
	
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
}

tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
}

tasks.named('test') {
	useJUnitPlatform()
}
