plugins {
    id 'org.springframework.boot' version '4.1.1' apply false
    id 'io.spring.dependency-management' version '1.1.7' apply false
    id 'com.diffplug.spotless' version '8.10.4' apply false
}

// -PffBuildRoot=/tmp/x moves all build output (lets several builds of one checkout run side by side).
def ffBuildRoot = providers.gradleProperty('ffBuildRoot').orNull

allprojects {
    group = 'com.example.funfridaygame'
    version = '2.0.0'

    repositories {
        mavenCentral()
    }

    if (ffBuildRoot) {
        def name = path == ':' ? 'root' : path.substring(1).replace(':', '-')
        layout.buildDirectory = file("${ffBuildRoot}/${name}")
    }
}

def javaProjects = subprojects.findAll { it.path != ':games' }
def gameProjects = subprojects.findAll { it.path.startsWith(':games:') }

configure(javaProjects) {
    apply plugin: 'java-library'
    apply plugin: 'io.spring.dependency-management'
    apply plugin: 'checkstyle'
    apply plugin: 'com.diffplug.spotless'

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(25)
        }
    }

    dependencyManagement {
        imports {
            mavenBom org.springframework.boot.gradle.plugin.SpringBootPlugin.BOM_COORDINATES
        }
    }

    dependencies {
        testImplementation 'org.junit.jupiter:junit-jupiter'
        testImplementation 'org.assertj:assertj-core'
        testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
        options.compilerArgs += ['-parameters', '-Xlint:all,-serial,-processing']
    }

    tasks.withType(Test).configureEach {
        useJUnitPlatform()
        testLogging {
            events 'failed'
            exceptionFormat = 'full'
        }
    }

    checkstyle {
        toolVersion = '14.3.0'
        configFile = rootProject.file('config/checkstyle/checkstyle.xml')
        maxWarnings = 0
    }

    // google-java-format (AOSP: 4-space indent, 100 columns) owns layout and import order; the
    // version is Spotless's default so the formatter and Spotless's glue code always match.
    spotless {
        java {
            target 'src/**/*.java'
            removeUnusedImports()
            googleJavaFormat().aosp()
            formatAnnotations()
            trimTrailingWhitespace()
            endWithNewline()
        }
    }
}

// Conventions for every game module: no per-game build file is needed.
configure(gameProjects) {
    description = "Fun Friday game module ${project.name}"

    dependencies {
        api project(':sdk')
        testImplementation project(':testkit')
    }
}
