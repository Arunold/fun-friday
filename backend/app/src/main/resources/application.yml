# Fun Friday — production defaults. Override with environment variables (see README).
spring:
  application:
    name: fun-friday
  threads:
    virtual:
      enabled: true
  jackson:
    default-property-inclusion: non_null
    deserialization:
      # Jackson 3 rejects missing primitive values by default; optional flags default to false/0.
      fail-on-null-for-primitives: false
  datasource:
    url: jdbc:h2:file:${app.data-dir}/funfriday;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password: ""
  flyway:
    enabled: true
  web:
    resources:
      cache:
        cachecontrol:
          max-age: 7d

server:
  port: ${PORT:8080}
  # Honour X-Forwarded-* from the platform's proxy (correct scheme/host, same-origin WebSocket checks).
  forward-headers-strategy: framework
  shutdown: graceful
  compression:
    enabled: true
    mime-types: application/json,text/html,text/css,application/javascript

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
  info:
    env:
      enabled: true

info:
  app:
    name: Fun Friday
    version: 2.0.0

# API docs are off in production; the dev and test profiles switch them on (docs/openapi.json is the
# committed contract). Set API_DOCS_ENABLED=true to expose them anyway.
springdoc:
  api-docs:
    enabled: ${API_DOCS_ENABLED:false}
    path: /v3/api-docs
  swagger-ui:
    enabled: ${API_DOCS_ENABLED:false}
    path: /swagger-ui.html

app:
  data-dir: ${FF_DATA_DIR:./data}
  cors: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
  websocket-origins: ${WS_ALLOWED_ORIGINS:http://localhost:4200}
  timing:
    start-countdown: 3s
    reveal: 5s
    presence-grace: 30s
    broadcast-coalesce: 50ms
  rooms:
    max-rooms: 500
    idle-timeout: 10m
    inactive-timeout: 2h
    max-age: 12h
  rate-limit:
    capacity: 40
    refill-per-second: 20

logging:
  pattern:
    level: "%5p [%X{room:-}]"
